<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Minimal terminal window with a glowing block cursor">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#C6F24E" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#C6F24E" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#C6F24E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0D0B"/>
      <stop offset="100%" stop-color="#10140E"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.1" fill="#EEF2E6" fill-opacity="0.07"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#dots)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- corner ticks -->
  <g stroke="#EEF2E6" stroke-opacity="0.25" stroke-width="2">
    <path d="M40 56 V40 H56"/>
    <path d="M1144 40 H1160 V56"/>
    <path d="M1160 694 V710 H1144"/>
    <path d="M56 710 H40 V694"/>
  </g>

  <!-- window drop shadow -->
  <rect x="282" y="216" width="660" height="350" rx="16" fill="#000000" fill-opacity="0.5" filter="url(#blur)"/>

  <!-- terminal window -->
  <rect x="270" y="200" width="660" height="350" rx="14" fill="#121511" stroke="#EEF2E6" stroke-opacity="0.16" stroke-width="1.5"/>
  <line x1="270" y1="252" x2="930" y2="252" stroke="#EEF2E6" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- traffic lights -->
  <circle cx="302" cy="226" r="7" fill="#EEF2E6" fill-opacity="0.18"/>
  <circle cx="328" cy="226" r="7" fill="#EEF2E6" fill-opacity="0.18"/>
  <circle cx="354" cy="226" r="7" fill="#C6F24E" fill-opacity="0.85"/>

  <!-- line 1: prompt chevron + typed text bars + cursor -->
  <path d="M310 312 L338 336 L310 360" fill="none" stroke="#C6F24E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="366" y="324" width="128" height="22" rx="7" fill="#EEF2E6" fill-opacity="0.30"/>
  <rect x="508" y="324" width="74" height="22" rx="7" fill="#EEF2E6" fill-opacity="0.18"/>
  <rect x="596" y="324" width="100" height="22" rx="7" fill="#EEF2E6" fill-opacity="0.18"/>

  <!-- line 2: output bars -->
  <rect x="310" y="394" width="86" height="18" rx="6" fill="#EEF2E6" fill-opacity="0.12"/>
  <rect x="410" y="394" width="150" height="18" rx="6" fill="#EEF2E6" fill-opacity="0.12"/>
  <rect x="574" y="394" width="60" height="18" rx="6" fill="#EEF2E6" fill-opacity="0.12"/>

  <!-- line 3: prompt + block cursor -->
  <path d="M310 452 L338 476 L310 500" fill="none" stroke="#EEF2E6" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="366" y="458" width="26" height="36" fill="#C6F24E" filter="url(#blur)" fill-opacity="0.85"/>
  <rect x="366" y="458" width="26" height="36" fill="#C6F24E"/>
</svg>
